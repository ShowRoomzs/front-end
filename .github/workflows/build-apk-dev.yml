      - name: Get latest build info
        id: build_info
        run: |
          set +e
          echo "== whoami =="
          eas whoami
          echo "whoami exit code: $?"

          echo "== project info =="
          eas project:info
          echo "project info exit code: $?"

          echo "== build list =="
          eas build:list --limit 1 --platform android --status finished --non-interactive --json
          echo "build list exit code: $?"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

