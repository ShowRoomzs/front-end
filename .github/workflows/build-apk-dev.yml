name: Build APK and Upload to Discord

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install EAS CLI
        run: npm install -g eas-cli@^16

      - name: Authenticate with EAS
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # --json 을 함께 주면 완료된 빌드 정보가 그대로 stdout 으로 나온다.
      # 예전처럼 build:list 로 "방금 만든 빌드를 다시 찾는" 방식은 쓰지 않는다 —
      # 호출이 한 번 더 필요할 뿐 아니라, 동시에 다른 빌드가 돌면 --limit 1 이
      # 엉뚱한 빌드를 집어 Discord 에 잘못된 링크가 나간다.
      - name: Start EAS build (APK)
        run: |
          eas build --platform android --non-interactive --profile development --wait --json > build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Get build info
        id: build_info
        run: |
          # --json 출력은 빌드 배열이다. 형식이 바뀌어도 알아채도록 먼저 검증한다.
          if ! jq -e 'type == "array" and length > 0' build.json > /dev/null; then
            echo "::error::예상과 다른 eas build --json 출력입니다"
            cat build.json
            exit 1
          fi

          {
            echo "url=$(jq -r '.[0].artifacts.buildUrl // empty' build.json)"
            echo "version=$(jq -r '.[0].appVersion // empty' build.json)"
            echo "commit_hash=$(jq -r '.[0].gitCommitHash // empty' build.json)"
            # 커밋 메시지는 여러 줄일 수 있어 첫 줄만 쓴다 (GITHUB_OUTPUT 이 깨지지 않게)
            echo "commit_msg=$(jq -r '.[0].gitCommitMessage // empty' build.json | head -1)"
          } >> $GITHUB_OUTPUT

      - name: Send to Discord
        run: |
          TIMESTAMP=$(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M:%S KST')
          curl -X POST -H "Content-Type: application/json" \
          -d "{
            \"content\": \"🌿 **Branch**\n\`${{ github.ref_name }}\`\n\n🔗 **Download**\n[Click here to download the APK](${{ steps.build_info.outputs.url }})\n\n📱 **App Version**\n\`${{ steps.build_info.outputs.version }}\`\n\n📝 **Last Commit**\n[\`${{ steps.build_info.outputs.commit_msg }}\`](https://github.com/ShowRoomzs/front-end/commit/${{ steps.build_info.outputs.commit_hash }})\n\n🕒 **Build Timestamp**\n${TIMESTAMP}\"
          }" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
